[package]
authors = ["Casey Primozic <casey@cprimozic.net>"]
edition = "2018"
name = "engine"
version = "0.1.0"

[dependencies]
ncollide2d = "0.33"
wasm-bindgen = "=0.2.92"
# default-features off avoids `getrandom`, which won't build for wasm32-unknown-unknown; we only use a seeded Pcg32.
rand = { version = "0.8", default-features = false }
rand_pcg = "0.3"
rand_core = "0.6"
console_error_panic_hook = "0.1.6"

[lib]
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
